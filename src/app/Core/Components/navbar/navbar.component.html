<nav class="navbar navbar-expand border-bottom app-navbar" dir="ltr">
  <div
    class="container-fluid px-3 d-flex align-items-center justify-content-between"
  >
    <!-- سمت چپ: خروج + تم + مشخصات کاربر -->
    <div class="d-flex align-items-center gap-3" dir="rtl">
      <!-- نمایش نام و نقش کاربر (تنها در صورت لاگین بودن) -->
      @if (currentUser$ | async; as user) {
        <div class="user-profile-badge d-flex align-items-center gap-2">
          <button type="button" class="user-profile-badge d-flex align-items-center gap-2 border-0 bg-transparent"
        (click)="openProfile(user)" title="ویرایش پروفایل">
          <span class="user-avatar-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <span class="user-fullname fw-bold">
            {{ user.fullName }}
          </span>
          <span class="badge user-role-badge">
            {{ user.role }}
          </span>
          </button>
        </div>
      }

      <!-- دکمه سوئیچ تم خورشید / ماه -->
      <button
        type="button"
        class="icon-action-btn"
        (click)="themeService.toggleTheme()"
        [title]="themeService.isDark ? 'حالت روشن' : 'حالت تاریک'"
        aria-label="Toggle Theme"
      >
        @if (themeService.isDark) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        }

        @if (!themeService.isDark) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        }
      </button>

      <!-- دکمه خروج از حساب -->
       @if (currentUser$ | async) {
      <button
        type="button"
        class="icon-action-btn logout-btn"
        (click)="onLogout()"
        title="خروج از حساب کاربری"
        aria-label="Logout"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
      }
    </div>

    <!-- سمت راست: دکمه سایدبار + لوگو -->
    <div class="d-flex align-items-center gap-3" dir="rtl">
      <!-- دکمه سایدبار فقط برای کاربران لاگین‌شده نمایش داده شود -->
      @if (currentUser$ | async) {
        <button
          type="button"
          class="icon-action-btn sidebar-toggle-btn"
          [class.active]="sidebarService.isOpen$ | async"
          (click)="sidebarService.toggle()"
          title="تغییر منو"
          aria-label="Toggle Sidebar"
        >
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
        </button>
      }

      <!-- لوگو -->
      <a class="navbar-brand m-0 d-flex align-items-center" routerLink="/">
        <img
          src="assets/Logo.png"
          width="38"
          height="38"
          alt="Logo"
          class="rounded"
        />
      </a>
    </div>

  </div>
</nav>

<app-user-form
  #profileForm
  modalId="profileModal"
  [selfMode]="true"
  [roleOptions]="[]"
  (saved)="onProfileSaved()"
  (operationError)="onProfileError($event)">
</app-user-form>
