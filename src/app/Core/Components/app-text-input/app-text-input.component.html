<div class="mb-3 w-100">
  <p-floatLabel class="w-100 d-block">
    <div [class.p-input-icon-left]="iconClass" class="w-100">
      <i *ngIf="iconClass" [class]="iconClass"></i>
      <input
        pInputText
        [id]="inputId"
        [name]="name"
        [type]="type"
        [dir]="dir"
        class="w-100"
        [class.ng-invalid]="isInvalid"
        [class.ng-dirty]="isInvalid"
        [placeholder]="placeholder"
        [value]="value"
        [disabled]="disabled"
        [required]="required"
        [attr.maxlength]="maxLength !== null ? maxLength : null"
        [attr.minlength]="minLength !== null ? minLength : null"
        (input)="onInput($event)"
        (blur)="onTouched()"
        autocomplete="off"
      />
    </div>

    <label [attr.for]="inputId">
      {{ label }}
      <span *ngIf="required" class="text-danger ms-1">*</span>
    </label>
  </p-floatLabel>

  <div *ngIf="isInvalid && errorMessage" class="text-danger small mt-1">
    {{ errorMessage }}
  </div>
</div>
