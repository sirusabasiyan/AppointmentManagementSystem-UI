<app-generic-table
  [title]="'لیست بازه‌های زمانی ملاقات'"
  [subtitle]="'مدیریت و مشاهده ساعات تعریف‌شده برای نوبت‌دهی'"
  [items]="AppointmentTimes || []"
  [columns]="columns"
  [pageSize]="10"
  [emptyText]="'هیچ بازه زمانی تعریف نشده است'"
  [emptyHint]="'برای شروع، روی دکمه تعریف بازه زمانی کلیک کنید'"
>
  <!-- دکمه هدر -->
  <ng-template #headerActions>
    <button
      type="button"
      class="btn btn-success d-inline-flex align-items-center justify-content-center gap-2 px-3 py-2 fw-semibold rounded-3 shadow-sm"
      data-bs-toggle="modal"
      data-bs-target="#appointmentTimeModal"
      (click)="openCreateModal()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        fill="currentColor"
        class="bi bi-plus-circle-fill"
        viewBox="0 0 16 16"
      >
        <path
          d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3z"
        />
      </svg>
      <span>تعریف بازه زمانی جدید</span>
    </button>
  </ng-template>

  <!-- سطر جدول -->
  <ng-template #rowTemplate let-item>
    <td class="fw-bold text-dark py-2 px-2">
      <div class="d-flex align-items-center gap-2">
        <span
          class="badge bg-success bg-opacity-10 text-success p-1 rounded-2 d-none d-sm-inline-flex"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            fill="currentColor"
            class="bi bi-clock"
            viewBox="0 0 16 16"
          >
            <path
              d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71z"
            />
            <path
              d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16m7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0"
            />
          </svg>
        </span>
        <span class="text-truncate">{{ item.title }}</span>
      </div>
    </td>

    <td class="text-center py-2 px-1">
      <span
        class="badge bg-light text-dark border px-2 py-1 font-monospace"
        style="font-size: 0.85rem"
      >
        {{ item.startTime }}
      </span>
    </td>

    <td class="text-center py-2 px-1">
      <span
        class="badge bg-light text-dark border px-2 py-1 font-monospace"
        style="font-size: 0.85rem"
      >
        {{ item.endTime }}
      </span>
    </td>

    <td class="text-center py-2 px-1">
      <div class="d-inline-flex align-items-center gap-1">
        <!-- دکمه ویرایش اصلاح شده -->
        <button
          class="btn btn-sm btn-light text-primary border-0 p-1 rounded-2"
          title="ویرایش"
          data-bs-toggle="modal"
          data-bs-target="#appointmentTimeModal"
          (click)="openEditModal(item)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="15"
            height="15"
            fill="currentColor"
            class="bi bi-pencil-square"
            viewBox="0 0 16 16"
          >
            <path
              d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"
            />
            <path
              fill-rule="evenodd"
              d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"
            />
          </svg>
        </button>

        <button
          class="btn btn-sm btn-light text-danger border-0 p-1 rounded-2"
          title="حذف"
          (click)="deleteAppointmentTime(item)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="15"
            height="15"
            fill="currentColor"
            class="bi bi-trash3"
            viewBox="0 0 16 16"
          >
            <path
              d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"
            />
          </svg>
        </button>
      </div>
    </td>
  </ng-template>
</app-generic-table>

<AppointmentTimeForm
  #appointmentTimeForm
  (saved)="onSaved($event)"
  (operationError)="showError($event)"
></AppointmentTimeForm>
