<app-generic-table
  [title]="'مدیریت کاربران'"
  [subtitle]="'فهرست و پیکربندی کاربران سیستم'"
  [items]="users || []"
  [columns]="columns"
  [pageSize]="10"
  [emptyText]="'هیچ کاربری یافت نشد'"
  [emptyHint]="'جهت ثبت اولین کاربر، روی دکمه کاربر جدید کلیک کنید'"
>
  <!-- دکمه هدر (مشابه با استایل فرم نقش‌ها) -->
  <ng-template #headerActions>
    <button
      type="button"
      class="btn btn-success d-inline-flex align-items-center justify-content-center gap-2 px-3 py-2 fw-semibold rounded-3 shadow-sm"
      data-bs-toggle="modal"
      data-bs-target="#userModal"
      (click)="openCreateModal()"
    >

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        fill="currentColor"
        class="bi bi-person-plus-fill"
        viewBox="0 0 16 16"
      >
        <path
          d="M1 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"
        />
        <path
          fill-rule="evenodd"
          d="M13.5 5a.5.5 0 0 1 .5.5V7h1.5a.5.5 0 0 1 0 1H14v1.5a.5.5 0 0 1-1 0V8h-1.5a.5.5 0 0 1 0-1H13V5.5a.5.5 0 0 1 .5-.5"
        />
      </svg>
      <span>ثبت کاربر جدید</span>
    </button>
  </ng-template>

  <!-- سطر جدول -->
  <ng-template #rowTemplate let-item>
    <!-- ۱. نام و نام خانوادگی -->
    <td class="fw-bold text-dark py-2 px-3">
      <div class="d-flex align-items-center gap-2">
        <span
          class="badge bg-primary bg-opacity-10 text-primary p-1 rounded-2 d-none d-sm-inline-flex"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            fill="currentColor"
            class="bi bi-person"
            viewBox="0 0 16 16"
          >
            <path
              d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"
            />
          </svg>
        </span>
        <span class="text-truncate">{{ item.fullName || "---" }}</span>
      </div>
    </td>

    <!-- ۲. شماره همراه (شناسه ورود) -->
    <td class="text-center py-2 px-1">
      <span
        class="badge bg-light text-dark border px-2 py-1 font-monospace"
        style="font-size: 0.85rem"
        dir="ltr"
      >
        {{ item.mobile }}
      </span>
    </td>

    <!-- ۳. کد ملی -->
    <td class="text-center py-2 px-1">
      <span
        class="badge bg-light text-secondary border px-2 py-1 font-monospace"
        style="font-size: 0.85rem"
        dir="ltr"
      >
        {{ item.nationalCode || "---" }}
      </span>
    </td>

    <!-- ۴. نقش‌ها -->
    <td class="text-center py-2 px-1">
      @if (item.roleTitles && item.roleTitles.length > 0) {
        @for (r of item.roleTitles; track r) {
          <span
            class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25 px-2 py-1 me-1"
          >
            {{ r }}
          </span>
        }
      } @else {
        <span class="text-muted small">بدون نقش</span>
      }
    </td>

    <!-- ۵. وضعیت -->
    <td class="text-center py-2 px-1">
      @if (item.isActive) {
        <span
          class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 px-2 py-1"
        >
          فعال
        </span>
      }
      @if (!item.isActive) {
        <span
          class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 px-2 py-1"
        >
          غیرفعال
        </span>
      }
    </td>

    <!-- ۶. دکمه‌های عملیات -->
    <td class="text-center py-2 px-1">
      <div class="d-inline-flex align-items-center gap-1">
        <!-- ویرایش -->
          <button
            class="btn btn-sm btn-light text-primary border-0 p-1 rounded-2"
            title="ویرایش کاربر"
            data-bs-toggle="modal"
            data-bs-target="#userModal"
            (click)="openEditModal(item)"
          >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="15"
            height="15"
            fill="currentColor"
            class="bi bi-pencil-square"
            viewBox="0 0 16 16"
          >
            <path
              d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"
            />
            <path
              fill-rule="evenodd"
              d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"
            />
          </svg>
        </button>

        <!-- حذف -->
        <button
          class="btn btn-sm btn-light text-danger border-0 p-1 rounded-2"
          title="حذف کاربر"
          (click)="deleteUser(item)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="15"
            height="15"
            fill="currentColor"
            class="bi bi-trash3"
            viewBox="0 0 16 16"
          >
            <path
              d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"
            />
          </svg>
        </button>
      </div>
    </td>
  </ng-template>
</app-generic-table>


<app-user-form
  #userFormComp
  [roleOptions]="roles"
  [user]="selectedUser"
  [mode]="formMode"
  (saved)="onFormSaved()"
  (operationError)="showError($event)"
>
</app-user-form>
