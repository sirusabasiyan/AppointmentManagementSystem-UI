<app-generic-table
  [title]="'مدیریت نقش‌ها'"
  [subtitle]="'مدیریت و پیکربندی سطوح دسترسی کاربران'"
  [items]="roles || []"
  [columns]="columns"
  [pageSize]="10"
  [emptyText]="'هیچ نقشی تعریف نشده است'"
  [emptyHint]="'برای شروع، روی دکمه نقش جدید کلیک کنید'"
>
  <!-- دکمه هدر ثبت نقش جدید -->
  <ng-template #headerActions>
    <button
      type="button"
      class="btn btn-success d-inline-flex align-items-center justify-content-center gap-2 px-3 py-2 fw-semibold rounded-3 shadow-sm"
      data-bs-toggle="modal"
      data-bs-target="#roleModal"
      (click)="openCreateModal()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        fill="currentColor"
        class="bi bi-plus-circle-fill"
        viewBox="0 0 16 16"
      >
        <path
          d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3z"
        />
      </svg>
      <span>ثبت نقش جدید</span>
    </button>
  </ng-template>

  <!-- سطر جدول -->
  <ng-template #rowTemplate let-item>
    <!-- ۱. عنوان نقش -->
    <td class="fw-bold text-dark py-2 px-3">
      <div class="d-flex align-items-center gap-2">
        <span
          class="badge bg-primary bg-opacity-10 text-primary p-1 rounded-2 d-none d-sm-inline-flex"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            fill="currentColor"
            class="bi bi-shield-lock"
            viewBox="0 0 16 16"
          >
            <path
              d="M5.338 1.59a61.44 61.44 0 0 0-2.837.856.481.481 0 0 0-.328.39c-.554 4.157.726 7.19 2.253 9.188a10.725 10.725 0 0 0 2.287 2.233c.346.244.652.42.893.533.12.057.218.095.293.118a.55.55 0 0 0 .101.025.615.615 0 0 0 .1-.025c.076-.023.174-.061.294-.118.24-.113.547-.29.893-.533a10.726 10.726 0 0 0 2.287-2.233c1.527-1.997 2.807-5.031 2.253-9.188a.48.48 0 0 0-.328-.39c-.651-.213-1.75-.56-2.837-.855C9.552 1.29 8.531 1.067 8 1.067c-.53 0-1.552.223-2.662.524zM5.072.56C6.157.265 7.31 0 8 0s1.843.265 2.928.56c1.11.3 2.229.655 2.887.87a1.54 1.54 0 0 1 1.044 1.262c.599 4.497-.71 7.776-2.363 9.941a11.775 11.775 0 0 1-2.52 2.455c-.302.218-.635.42-.978.59l-.05.024-.009.004-.003.001a1.782 1.782 0 0 1-.884 0l-.003-.001-.009-.004-.05-.024a9.834 9.834 0 0 1-.978-.59 11.775 11.775 0 0 1-2.52-2.455C3.385 10.438 2.076 7.159 2.675 2.662A1.54 1.54 0 0 1 3.719 1.43c.658-.215 1.777-.57 2.887-.87z"
            />
            <path
              d="M9.5 6.5a1.5 1.5 0 0 1-1 1.415l.385 1.99a.5.5 0 0 1-.491.595h-.788a.5.5 0 0 1-.49-.595l.384-1.99A1.5 1.5 0 1 1 9.5 6.5z"
            />
          </svg>
        </span>
        <span class="text-truncate">{{ item.title }}</span>
      </div>
    </td>

    <!-- ۲. نام لاتین -->
    <td class="text-center py-2 px-1">
      <span
        class="badge bg-light text-dark border px-2 py-1 font-monospace"
        style="font-size: 0.85rem"
        dir="ltr"
      >
        {{ item.name }}
      </span>
    </td>

    <!-- ۳. کلید عددی (GKey) -->
    <td class="text-center py-2 px-1">
      <span
        class="badge bg-light text-secondary border px-2 py-1 font-monospace"
        style="font-size: 0.85rem"
      >
        {{ item.gKey }}
      </span>
    </td>

    <!-- ۴. نقش والد -->
    <td class="text-center py-2 px-1">
      @if (item.parentRoleTitle) {
        <span
          class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25 px-2 py-1"
        >
          {{ item.parentRoleTitle }}
        </span>
      }
      @if (!item.parentRoleTitle) {
        <span class="text-muted small"> ریشه </span>
      }
    </td>

    <!-- ۵. وضعیت -->
    <td class="text-center py-2 px-1">
      @if (item.isActive) {
        <span
          class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 px-2 py-1"
        >
          فعال
        </span>
      }
      @if (!item.isActive) {
        <span
          class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 px-2 py-1"
        >
          غیرفعال
        </span>
      }
    </td>

    <!-- ۶. دکمه‌های عملیات -->
    <td class="text-center py-2 px-1">
      <div class="d-inline-flex align-items-center gap-1">
        <!-- مدیریت دسترسی‌ها -->
        <button
          class="btn btn-sm btn-light text-warning border-0 p-1 rounded-2"
          title="مدیریت دسترسی‌های نقش"
          data-bs-toggle="modal"
          data-bs-target="#rolePermissionsModal"
          (click)="openPermissionsModal(item)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-key-fill"
            viewBox="0 0 16 16"
          >
            <path
              d="M3.5 11.5a3.5 3.5 0 1 1 3.163-5H14L15.5 8 14 9.5l-1-1-1 1-1-1-1 1-1.337-.337A3.5 3.5 0 0 1 3.5 11.5M3 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4"
            />
          </svg>
        </button>

        <!-- ویرایش نقش -->
        <button
          class="btn btn-sm btn-light text-primary border-0 p-1 rounded-2"
          title="ویرایش نقش"
          data-bs-toggle="modal"
          data-bs-target="#roleModal"
          (click)="openUpdateModal(item)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="15"
            height="15"
            fill="currentColor"
            class="bi bi-pencil-square"
            viewBox="0 0 16 16"
          >
            <path
              d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"
            />
            <path
              fill-rule="evenodd"
              d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"
            />
          </svg>
        </button>

        <!-- حذف نقش -->
        <button
          class="btn btn-sm btn-light text-danger border-0 p-1 rounded-2"
          title="حذف نقش"
          (click)="deleteRole(item)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="15"
            height="15"
            fill="currentColor"
            class="bi bi-trash3"
            viewBox="0 0 16 16"
          >
            <path
              d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"
            />
          </svg>
        </button>
      </div>
    </td>
  </ng-template>
</app-generic-table>

<!-- مودال واحد ثبت / ویرایش نقش -->
<app-role-form
  #roleForm
  [parentOptions]="roles || []"
  (saved)="onSaved($event)"
  (operationError)="showError($event)"
>
</app-role-form>

<!-- مودال مدیریت دسترسی‌های نقش -->
<app-role-permissions #permissionsModal (onSaved)="loadRoles()">
</app-role-permissions>
