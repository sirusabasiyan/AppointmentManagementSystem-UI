<div class="d-flex flex-column vh-100 overflow-hidden" dir="rtl">
  <app-navbar></app-navbar>

  <div class="d-flex flex-grow-1 overflow-hidden position-relative">
    @if (!isLoginPage) {
      <app-sidebar></app-sidebar>
    }

    <main
      class="flex-grow-1"
      [class.login-main]="isLoginPage"
      [class.overflow-auto]="!isLoginPage"
      [class.bg-light]="!isLoginPage"
      [class.p-3]="!isLoginPage"
    >
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<p-toast position="top-right"></p-toast>
<app-loading></app-loading>
